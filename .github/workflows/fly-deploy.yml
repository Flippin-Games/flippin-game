name: Deploy to Fly

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Build and push Docker image
        run: |
          flyctl auth docker
          docker build -t registry.fly.io/flippin-game:latest ./socketio-server
          docker push registry.fly.io/flippin-game:latest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly
        run: flyctl deploy -a flippin-game --image registry.fly.io/flippin-game:latest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}