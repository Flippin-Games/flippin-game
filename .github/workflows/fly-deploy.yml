name: Deploy to Fly

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: 
        flyctl auth docker
        docker build -t registry.fly.io/flippin-game:latest ./socketio-server
        docker push registry.fly.io/flippin-game:latest
        flyctl deploy -a flippin-game --image registry.fly.io/flippin-game:latest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}