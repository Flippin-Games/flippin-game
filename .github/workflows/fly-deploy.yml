name: Deploy to Fly

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: cd socketio-server && flyctl deploy --remote-only -a flippin-game --depot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}